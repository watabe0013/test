<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>カウンター</title>
  <meta name="theme-color" content="#111" />
  <style>
    :root { --bg:#111; --fg:#fff; --muted:#9aa0a6; --accent:#4caf50; --danger:#ef5350; }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; background: var(--bg); color: var(--fg); font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Hiragino Kaku Gothic ProN", Meiryo, sans-serif; }
    .app { min-height: 100%; display: grid; grid-template-rows: auto 1fr auto; gap: 16px; padding: 16px; max-width: 520px; margin: 0 auto; }
    header { display:flex; align-items:center; justify-content:space-between; }
    header h1 { font-size: 20px; margin: 0; font-weight: 700; letter-spacing: .02em; }
    header .sub { color: var(--muted); font-size: 12px; }
    .display { display:grid; place-items:center; }
    .value { font-size: clamp(64px, 16vw, 120px); font-weight: 800; letter-spacing: .02em; line-height: 1; }
    .buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    button { appearance: none; border: none; border-radius: 16px; padding: 18px 20px; font-size: clamp(16px, 4vw, 22px); font-weight: 700; color: #fff; background: #333; box-shadow: 0 8px 20px rgba(0,0,0,.25); touch-action: manipulation; }
    .plus { background: var(--accent); }
    .minus { background: #2b2b2b; }
    .reset { background: var(--danger); grid-column: 1 / -1; }
    .row { display:flex; gap:12px; align-items:center; justify-content:space-between; }
    .ghost { background: transparent; color: var(--muted); border: 1px solid #2a2a2a; }
    footer { color: var(--muted); font-size: 12px; display:flex; gap:8px; align-items:center; justify-content:space-between; flex-wrap: wrap; }
    .hint { opacity:.9; }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div>
        <h1>カウンター</h1>
        <div class="sub">タップで +1、長押しで +10 / -10</div>
      </div>
      <button id="fullscreen" class="ghost" title="全画面">全画面</button>
    </header>

    <section class="display">
      <div id="value" class="value" role="status" aria-live="polite">0</div>
    </section>

    <section class="buttons">
      <button id="minus" class="minus" aria-label="マイナス">−1</button>
      <button id="plus" class="plus" aria-label="プラス">＋1</button>
      <button id="reset" class="reset" aria-label="リセット">リセット</button>
    </section>

    <footer>
      <div class="hint">値は自動保存（端末内）されます。</div>
      <div>
        <button id="setZero" class="ghost">0 にする</button>
        <button id="copy" class="ghost">値をコピー</button>
      </div>
    </footer>
  </div>

  <script>
    const KEY = 'counter.value.v1';
    const valEl = document.getElementById('value');
    const plusBtn = document.getElementById('plus');
    const minusBtn = document.getElementById('minus');
    const resetBtn = document.getElementById('reset');
    const copyBtn = document.getElementById('copy');
    const setZeroBtn = document.getElementById('setZero');
    const fsBtn = document.getElementById('fullscreen');

    let value = Number(localStorage.getItem(KEY) || 0) || 0;
    render();

    function render(){
      valEl.textContent = value;
      localStorage.setItem(KEY, String(value));
    }

    function vib(duration=15){
      try { navigator.vibrate && navigator.vibrate(duration); } catch(_){}
    }

    function step(delta){
      value += delta;
      render();
      vib(10);
    }

    let longPressTimer; let isLong = false;
    function bindPress(el, shortDelta, longDelta){
      const start = () => { isLong = false; longPressTimer = setTimeout(()=>{ isLong = true; step(longDelta); }, 420); };
      const end = () => { clearTimeout(longPressTimer); if(!isLong) step(shortDelta); };
      el.addEventListener('touchstart', start, {passive:true});
      el.addEventListener('mousedown', start);
      ['touchend','mouseup','mouseleave'].forEach(e=> el.addEventListener(e, end));
    }

    bindPress(plusBtn, +1, +10);
    bindPress(minusBtn, -1, -10);

    resetBtn.addEventListener('click', ()=>{ if(confirm('カウンターをリセットしますか？')){ value = 0; render(); vib(30); } });
    setZeroBtn.addEventListener('click', ()=>{ value = 0; render(); vib(10); });

    copyBtn.addEventListener('click', async ()=>{
      try { await navigator.clipboard.writeText(String(value)); alert('値をコピーしました'); }
      catch { prompt('値をコピーしてください', String(value)); }
    });

    fsBtn.addEventListener('click', async ()=>{
      const el = document.documentElement;
      try{
        if(!document.fullscreenElement){ await (el.requestFullscreen && el.requestFullscreen()); }
        else { await (document.exitFullscreen && document.exitFullscreen()); }
      }catch(_){ /* ignore */ }
    });

    // キーボード操作（PC用）
    window.addEventListener('keydown', (e)=>{
      if(e.key === '+') step(+1);
      if(e.key === '-') step(-1);
      if(e.key === '0') { value = 0; render(); }
    });
  </script>
</body>
</html>
